name: Enterprise Automation Run

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: 'Workflow to run'
        required: true
        default: 'demo'
        type: choice
        options:
          - demo

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Chromium
      run: playwright install chromium --with-deps

    - name: Create Demo Input File
      if: github.event.inputs.workflow_name == 'demo'
      run: python create_demo_excel.py

    - name: Execute Workflow
      env:
        # Pulling sensitive data from GitHub Secrets
        APP_USERNAME: ${{ secrets.APP_USERNAME }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        # Set headless to true for GitHub Actions (no UI)
        BROWSER_HEADLESS: 'true'
        # Disable interactive features
        CI: 'true'
      run: |
        python main.py --workflow ${{ github.event.inputs.workflow_name }} --input data/input/demo.xlsx

    - name: Upload Output Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: automation-results
        path: |
          data/output/
          data/failed/
          data/screenshots/
          data/logs/
        retention-days: 7
