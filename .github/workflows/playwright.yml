name: Enterprise Automation Run

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: 'Workflow to run'
        required: true
        default: 'demo'
        type: choice
        options:
          - demo
          - village_report

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Chromium
      run: playwright install chromium --with-deps

    - name: Create Demo Input File
      if: github.event.inputs.workflow_name == 'demo'
      run: python create_demo_excel.py

    - name: Execute Workflow
      env:
        APP_USERNAME: ${{ secrets.APP_USERNAME }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        APP_URL: 'https://lcoportal.sscnxtdigital.in/'
        BROWSER_HEADLESS: 'true'
        CI: 'true'
      run: |
        python main.py --workflow ${{ github.event.inputs.workflow_name }} --input data/input/${{ github.event.inputs.workflow_name }}.xlsx || true

    - name: Upload Output Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: automation-results
        path: |
          data/output/
          data/failed/
          data/screenshots/
          data/logs/
        retention-days: 7

    - name: Prepare Pages Directory
      if: always()
      run: |
        mkdir -p data/report/screenshots
        cp -r data/screenshots/* data/report/screenshots/ 2>/dev/null || true

    - name: Setup Pages
      if: always()
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: data/report/

  deploy-pages:
    needs: run-automation
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
